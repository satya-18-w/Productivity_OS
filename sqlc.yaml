version: "2"
sql:
  - engine: "postgresql"
    schema: "db/migrations"
    queries: "internal/account/queries.sql"
    gen:
      go:
        package: "accountdb"
        out: "internal/account/accountdb"
        sql_package: "pgx/v5"
        emit_json_tags: false
        emit_interface: true
        emit_empty_slices: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "citext"
            go_type: "string"
